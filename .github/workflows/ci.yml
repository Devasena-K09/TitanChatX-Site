
name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify website files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          echo "TitanChatX website files verified!"
